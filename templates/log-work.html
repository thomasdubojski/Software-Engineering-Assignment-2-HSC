{% extends "base.html" %}

{% block title %}Calendar{% endblock %}

{% block content %}
<div form-container>   
    <div class="form-card">

        <h2>Log Study Session</h2>

        <!-- Live study tracker -->
        <h3>Live Timer</h3>

        <div id="timer">

        00:00:00

        </div>

        <button onclick="startTimer()"> Start </button>

        <button onclick="stopTimer()"> Finish </button>

        <hr>

        <!-- Manual study entry -->
        <h3>Manual Entry</h3>

        <form action="/log-work/{{ assignment.id }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Start date + time -->
        <label>Start</label>
        <div class="form-group">
            <input type="datetime-local" name="start">
        </div>

        <!-- End date + time -->
        <label> End </label>
        <div class="form-group">
            <input type="datetime-local" name="end">
        </div>

        <!-- Study category -->
        <label> Category </label>
        <div class="form-group">
            <select name="category">
            <option>Research</option>
            <option>Writing</option>
            <option>Revision</option>
            <option>Reading</option>
            </select>
        </div>
            
        <!-- Study notes -->
        <label> Notes </label>
        <div class="form-group">
            <textarea name="notes"></textarea>
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn btn-secondary">Save Session</button>

        </form>
    </div>
</div>

        
<script>

/* Live timer function */
let startTime;

let interval;

function startTimer(){

    startTime = new Date();

    interval = setInterval(updateTimer,1000);

}

function updateTimer(){

    let now = new Date();

    let diff = now-startTime;

    let seconds=Math.floor(diff/1000)%60;

    let minutes=Math.floor(diff/60000)%60;

    let hours=Math.floor(diff/3600000);

    document.getElementById("timer").innerHTML=

        String(hours).padStart(2,"0")+":"+

        String(minutes).padStart(2,"0")+":"+

        String(seconds).padStart(2,"0");

}

function stopTimer(){

    clearInterval(interval);

    let form=document.createElement("form");

    form.method="POST";

    form.action=window.location.pathname;

    const csrf = document.createElement("input");

    csrf.type = "hidden";

    csrf.name = "csrf_token";

    csrf.value = document.querySelector('meta[name="csrf-token"]').content;

    form.appendChild(csrf);

    let start=document.createElement("input");

    start.type="hidden";

    start.name="start";

    start.value =
        startTime.getFullYear() + "-" +
        String(startTime.getMonth() + 1).padStart(2, "0") + "-" +
        String(startTime.getDate()).padStart(2, "0") + "T" +
        String(startTime.getHours()).padStart(2, "0") + ":" +
        String(startTime.getMinutes()).padStart(2, "0");

    let end=document.createElement("input");

    end.type="hidden";

    end.name="end";

    const endTime = new Date();

    end.value =
        endTime.getFullYear() + "-" +
        String(endTime.getMonth() + 1).padStart(2, "0") + "-" +
        String(endTime.getDate()).padStart(2, "0") + "T" +
        String(endTime.getHours()).padStart(2, "0") + ":" +
        String(endTime.getMinutes()).padStart(2, "0");

    form.appendChild(start);

    form.appendChild(end);

    document.body.appendChild(form);

    form.submit();

}

</script>

{% endblock %}
