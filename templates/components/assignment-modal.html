<div id="sessionModal" class="modal hidden">
  <div class="modal-content">

    <span class="close-btn" id="closeSessionModal">&times;</span>

    <h2>Study Session</h2>

    <p><strong>Assignment:</strong> <span id="sessionAssignment"></span></p>
    <p><strong>Duration:</strong> <span id="sessionDuration"></span></p>

    <p><strong>Notes:</strong></p>
    <p id="sessionNotes"></p>

  </div>
</div>
<div id="modal" class="modal hidden">
  <div class="modal-content">

    <span id="closeBtn" class="close-btn">&times;</span>

    <h2 id="modalTitle"></h2>

    <p><strong>Subject:</strong> <span id="modalSubject"></span></p>
    <p><strong>Type:</strong> <span id="modalType"></span></p>
    <p><strong>Due:</strong> <span id="modalDue"></span></p>

    <span id="modalPriority" class="priority-bubble"></span>

    <span id="modalOverdue" class="overdue-bubble"></span>

    <hr>

    <p id="modalNotes"></p>

    <div class="modal-actions">

    <button type="button" id="editBtn" class="edit-btn">
        Edit Assignment
    </button>

    <button type="button" id="completeBtn" class="complete-btn">
        Mark as Complete
    </button>

    <button type="button" id="appleCalendarBtn" class="btn btn-secondary">
        <span class="material-symbols-outlined">file_save</span>
        Export as .ics file
    </button>

    <button type="button" id="googleCalendarBtn" class="btn btn-secondary">
    <img src="https://upload.wikimedia.org/wikipedia/commons/archive/a/a5/20221106121914%21Google_Calendar_icon_%282020%29.svg"
         style="width:18px; height:18px; margin-right:6px;">
    Add to Google Calendar
    </button>

    <button type="button" id="historyBtn" class="btn btn-secondary">
      <span class="material-symbols-outlined">history</span>
      Study History
    </button>

    <button type="button" id="deleteBtn" class="delete-btn">
      <span class="material-symbols-outlined">delete</span>
    </button>

  </div>
</div>
