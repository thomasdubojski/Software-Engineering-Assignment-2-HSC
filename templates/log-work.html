{% extends "base.html" %}

{% block title %}Calendar{% endblock %}

{% block content %}
<div form-container>
    <div class="form-card">

        <h2>Log Study Session</h2>

        <h3>Live Timer</h3>

        <div id="timer">

        00:00:00

        </div>

        <button onclick="startTimer()"> Start </button>

        <button onclick="stopTimer()"> Finish </button>

        <hr>

        <h3>Manual Entry</h3>

        <form action="/log-work/{{ assignment.id }}" method="POST">

        <label>

        Start

        </label>

        <div class="form-group">
            <input type="datetime-local" name="start">
        </div>

        <label> End </label>

        <div class="form-group">
            <input type="datetime-local" name="end">
        </div>

        <label> Category </label>

        <div class="form-group">
            <select name="category">

            <option>Research</option>
            <option>Writing</option>
            <option>Revision</option>
            <option>Reading</option>

            </select>

        </div>
            
            <label> Notes </label>

        <div class="form-group">
            <textarea name="notes">
            </textarea>
        </div>


        <button type="submit" class="btn btn-secondary">
        Save Session
        </button>

        </form>
    </div>
</div>

        
<script>

let startTime;

let interval;

function startTimer(){

    startTime = new Date();

    interval = setInterval(updateTimer,1000);

}

function updateTimer(){

    let now = new Date();

    let diff = now-startTime;

    let seconds=Math.floor(diff/1000)%60;

    let minutes=Math.floor(diff/60000)%60;

    let hours=Math.floor(diff/3600000);

    document.getElementById("timer").innerHTML=

        String(hours).padStart(2,"0")+":"+

        String(minutes).padStart(2,"0")+":"+

        String(seconds).padStart(2,"0");

}

function stopTimer(){

    clearInterval(interval);

    let form=document.createElement("form");

    form.method="POST";

    form.action=window.location.pathname;

    let start=document.createElement("input");

    start.type="hidden";

    start.name="start";

    start.value=startTime.toISOString().slice(0,16);

    let end=document.createElement("input");

    end.type="hidden";

    end.name="end";

    end.value=new Date().toISOString().slice(0,16);

    form.appendChild(start);

    form.appendChild(end);

    document.body.appendChild(form);

    form.submit();

}

</script>

{% endblock %}
