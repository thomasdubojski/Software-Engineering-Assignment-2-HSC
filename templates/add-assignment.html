{% extends 'base.html' %}

{% block title %}Add Assignment{% endblock %}

{% block heading %}Add an Assignment{% endblock %}

{% block text %}{% endblock %}

{% block content %}
<form id="assignment-form" action="/add-assignment" method="POST">

    <!-- Assignment type dropdown -->
    <label for="assignment_type">Assignment Type:</label>
    <select name="assignment_type" id="assignment_type" required>
        <option class="heading-option" value="">Select an assignment type</option>

        <option value="Take Home Assignment - Essay/Paper">Take Home Assignment - Essay/Paper</option>
        <option value="Take Home Assignment - Presentation/Speech">Take Home Assignment - Presentation/Speech</option>
        <option value="Take Home Assignment - Practical">Take Home Assignment - Practical</option>
        <option value="Take Home Assignment - Practical and Report">Take Home Assignment - Practical and Report</option>
        <option value="In Class Practical">In Class Practical</option>
        <option value="In Class Practical and Exam/Test">In Class Practical and Exam/Test</option>
        <option value="In Class Practical and Report">In Class Practical and Report</option>
        <option value="In Class Exam/Test">In Class Exam/Test</option>
        <option value="Take Home Assignment and In Class Exam/Test">Take Home Assignment and In Class Exam/Test</option>
        <option value="Other Take Home Assignment">Other Take Home Assignment</option>
        <option value="Other In Class Assignment">Other In Class Assignment</option>
        <option value="Other">Other</option>

    </select>
    <br><br>

    <!-- Course Dropdown -->
    <label for="course">Course:</label>
    <select name="course" id="course" required>
        <option class="heading-option" value="">Select a course</option>

        <!-- ENGLISH -->
        <option disabled>English Courses</option>
        <option value="Advanced English">Advanced English</option>
        <option value="Standard English">Standard English</option>
        <option value="English Studies">English Studies</option>
        <option value="English Ext 1">English Ext 1</option>
        <option value="English Ext 2">English Ext 2</option>

        <!-- MATHEMATICS -->
        <option disabled>Mathematics Courses</option>
        <option value="Mathematics Advanced">Mathematics Advanced</option>
        <option value="Mathematics Standard">Mathematics Standard</option>
        <option value="Mathematics Ext 1">Mathematics Ext 1</option>
        <option value="Mathematics Ext 2">Mathematics Ext 2</option>

        <!-- SCIENCE -->
        <option disabled>Science Courses</option>
        <option value="Biology">Biology</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Earth & Environmental Science">Earth & Environmental Science</option>
        <option value="Investigating Science">Investigating Science</option>
        <option value="Physics">Physics</option>

        <!-- HSIE -->
        <option disabled>HSIE Courses</option>
        <option value="Aboriginal Studies">Aboriginal Studies</option>
        <option value="Aboriginal Studies Dist Ed">Aboriginal Studies Dist Ed</option>
        <option value="Ancient History">Ancient History</option>
        <option value="Business Studies">Business Studies</option>
        <option value="Business Studies Dist Ed">Business Studies Dist Ed</option>
        <option value="Economics">Economics</option>
        <option value="Geography">Geography</option>
        <option value="Geography via Dist Ed">Geography Dist Ed</option>
        <option value="Legal Studies">Legal Studies</option>
        <option value="Modern History">Modern History</option>
        <option value="Society & Culture">Society & Culture</option>

        <!-- TAS -->
        <option disabled>TAS Courses</option>
        <option value="Agriculture">Agriculture</option>
        <option value="Design & Technology">Design & Technology</option>
        <option value="Hospitality">Hospitality</option>
        <option value="Industrial Technology">Industrial Technology</option>
        <option value="Primary Industries">Primary Industries</option>
        <option value="Software Engineering">Software Engineering</option>
        <option value="Textiles and Design">Textiles and Design</option>

        <!-- CAPA -->
        <option disabled>CAPA Courses</option>
        <option value="Drama">Drama</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Entertainment via Dist Ed">Entertainment via Dist Ed</option>
        <option value="Music Aural">Music Aural</option>
        <option value="Photography">Photography</option>
        <option value="Visual Arts">Visual Arts</option>

        <!-- PDHPE -->
        <option disabled>PDHPE Courses</option>
        <option value="CAFS">CAFS</option>
        <option value="Health & Movement Science">Health & Movement Science</option>
        <option value="SLR">SLR</option>
        <option value="Exploring Early Childhood">Exploring Early Childhood</option>

        <!-- Languages -->
        <option disabled>Language Courses</option>
        <option value="German Beginners Dist Ed">German Beginners Dist Ed</option>
        <option value="Japanese Continuers">Japanese Continuers</option>

        <!-- OTHER -->
        <option disabled>Other Courses</option>
        <option value="Work Studies">Work Studies</option>
        <option value="Other">Other</option>

    </select>
    <br><br>

    <!-- Assignment Notes -->
    <label for="assignmentNotes">Assignment Notes:</label><br>
    <textarea
        id="assignmentNotes"
        name="assignmentNotes"
        maxlength="500"
        oninput="updateCounter()"
    ></textarea>
    <div id="char-counter">0 / 500</div>
    <br><br>

    <label for="due_time">Due Time:</label>
    <input 
        type="time" 
        id="due_time" 
        name="due_time"
    >
    <br><br>

    <label for="due_date">Due Date:</label>
    <input 
        type="date" 
        id="due_date" 
        name="due_date" 
        required
    >
    <br><br>

    <input type="submit" value="Add Assignment">
</form>

<script>
function updateCounter() {
    const textarea = document.getElementById("assignmentNotes");
    const counter = document.getElementById("char-counter");
    const max = textarea.maxLength;
    const length = textarea.value.length;

    counter.textContent = `${length} / ${max}`;
    counter.style.color = length >= max ? "red" : "black";
}

document.getElementById("assignment-form").addEventListener("submit", function (e) {
    const text = document.getElementById("assignmentNotes").value.trim();
    if (text.length > 500) {
        alert("Assignment notes must be at most 500 characters long.");
        e.preventDefault();
    }
});

document.addEventListener("DOMContentLoaded", updateCounter);
</script>
{% endblock %}
