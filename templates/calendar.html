{% extends "base.html" %}

{% block title %}Calendar{% endblock %}

{% block content %}

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<div id="calendar"></div>

<script id="assignments-data" type="application/json">
    {{ assignments | default([]) | tojson }}
</script>

<script>
    window.assignments = JSON.parse(
        document.getElementById("assignments-data").textContent
    );
</script>

{% include "components/assignment-modal.html" %}

{% endblock %}
